name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ArgentSea.slnx

      - name: Test with coverage
        run: dotnet test ArgentSea.slnx --no-restore --collect:"Code Coverage;Format=Cobertura" --results-directory TestResults

      - name: Upload Cobertura coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-coverage
          path: TestResults/**/*.cobertura.xml
          if-no-files-found: warn

  # The integration project starts SQL Server and PostgreSQL with Testcontainers, which needs the Docker engine the
  # ubuntu runners provide (the windows job above runs it too, but every container-backed test skips there).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ArgentSea.Integration.Test/ArgentSea.Integration.Test.csproj

      - name: Integration tests (Testcontainers)
        run: dotnet test ArgentSea.Integration.Test/ArgentSea.Integration.Test.csproj --no-restore --logger "trx;LogFileName=integration.trx" --results-directory TestResults

      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
